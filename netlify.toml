# Estela en Netlify (estela.netlify.app)
# publish = packages/web/dist porque Vite (sin outDir propio en
# packages/web/vite.config.ts) emite por defecto a <root>/dist, es decir,
# packages/web/dist. El build corre en el workspace web, no en la raiz.

[build]
  command = "npm run build -w web"
  publish = "packages/web/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: React Router sirve /app, /privacidad y /terminos desde
# index.html. Sin esto, recargar /app devuelve 404 en Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Seguridad: CSP estricta para SPA Vite sin terceros.
# connect-src permite solo 'self' + localhost/127.0.0.1 (requests del usuario y tails).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

