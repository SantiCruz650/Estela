<!-- Logotipo Estela: punto sólido a la derecha = la request (el evento vivo);
     los dos trazos a la izquierda se desvanecen hacia atrás = la estela/rastro
     de logs que se apaga con la antigüedad. Cian de marca #22D3EE.
     Glifo único: header/landing + dashboard + favicon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g stroke="#22D3EE" stroke-linecap="round" fill="none">
    <path d="M3 12h12" stroke-width="3.5" opacity="0.3"/>
    <path d="M7 21h12" stroke-width="4.5" opacity="0.65"/>
  </g>
  <circle cx="24" cy="16" r="6" fill="#22D3EE"/>
</svg>
